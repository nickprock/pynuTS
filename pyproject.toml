[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pynuTS"
description = "A little Python library for Time Series, based on the IAML blog articles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Nicola Procopio", email = "nico.pro412@gmail.com" },
    { name = "Marcello Morchio" },
]
keywords = ["time series", "dynamic time warping", "SAX", "clustering", "imputation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "tqdm",
]
dynamic = ["version"]

[project.optional-dependencies]
demos = ["matplotlib"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/nickprock/pynuTS"
Repository = "https://github.com/nickprock/pynuTS"

[tool.setuptools]
packages = ["pynuTS"]

[tool.setuptools.dynamic]
version = { attr = "pynuTS.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
